name: produce
on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: produce
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get install -y fonts-dejavu-core ffmpeg
      - run: pip install -r requirements.txt
      - run: python agent/produce.py
        env:
          GH_TOKEN: ${{ github.token }}
