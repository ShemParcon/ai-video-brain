<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><meta name="theme-color" content="#111827"><title>Video Brain</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#e5e7eb;font:15px system-ui,sans-serif;padding-bottom:24px}
header{padding:14px 16px;font-weight:700;font-size:18px;background:#111827;position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center}
main{padding:12px;max-width:640px;margin:auto}nav{position:sticky;top:52px;z-index:4;display:flex;background:#111827;border-bottom:1px solid #1f2937}
nav button{flex:1;background:none;border:0;color:#9ca3af;padding:14px 4px;font-size:14px}nav button.on{color:#22c55e;font-weight:700}
.card{background:#151c30;border:1px solid #1f2937;border-radius:14px;padding:12px;margin:10px 0}
input,select,textarea{width:100%;background:#0b1020;color:#e5e7eb;border:1px solid #2b3550;border-radius:10px;padding:10px;font:inherit;margin:4px 0}
textarea{min-height:80px}button.b{background:#22c55e;color:#06220f;border:0;border-radius:10px;padding:10px 14px;font-weight:700;margin:4px 4px 4px 0}
button.g{background:#26304d;color:#e5e7eb}button.r{background:#7f1d1d;color:#fff}.chip{font-size:12px;padding:2px 8px;border-radius:99px;background:#26304d}
.bar{height:8px;background:#26304d;border-radius:9px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:#22c55e}
.err{color:#fca5a5;font-size:13px}.mut{color:#94a3b8;font-size:13px}video{width:100%;border-radius:10px;background:#000;max-height:60vh}
</style></head><body>
<header><span>🎬 Video Brain</span><span id="runs" class="mut"></span></header><nav><button data-t="progress">Progress</button><button data-t="videos">Videos</button><button data-t="plan">Plan</button><button data-t="settings">Settings</button></nav><main id="app">Loading…</main>

<script>
const LS=localStorage,$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if(location.hash.includes('t=')){const h=new URLSearchParams(location.hash.slice(1));LS.token=h.get('t')||LS.token;LS.repo=h.get('r')||LS.repo;history.replaceState(null,'',location.pathname)}
const m=location.hostname.match(/^(.+)\.github\.io$/),seg=location.pathname.split('/')[1];
const S={repo:LS.repo||(m&&seg?m[1]+'/'+seg:''),token:LS.token||'',tab:'progress',date:null,dates:[],cfg:{pages:[]},plan:{items:[]},status:{items:{}},res:{items:{}},runs:[],err:''};
const phToday=()=>new Date(Date.now()+8*3600e3).toISOString().slice(0,10);
const H=raw=>({Accept:raw?'application/vnd.github.raw+json':'application/vnd.github+json',...(S.token?{Authorization:'Bearer '+S.token}:{})});
const API=p=>'https://api.github.com/repos/'+S.repo+p;
async function gread(path){const r=await fetch(API('/contents/'+path+'?ref=main'),{headers:H(true),cache:'no-store'});if(r.status==404)return null;if(!r.ok)throw new Error(path+' '+r.status);return JSON.parse(await r.text())}
async function glist(path){const r=await fetch(API('/contents/'+path+'?ref=main'),{headers:H(false),cache:'no-store'});if(!r.ok)return[];return r.json()}
const b64=s=>btoa(unescape(encodeURIComponent(s)));
async function gwrite(path,obj,msg){let sha;const g=await fetch(API('/contents/'+path+'?ref=main'),{headers:H(false),cache:'no-store'});if(g.ok)sha=(await g.json()).sha;
 const r=await fetch(API('/contents/'+path),{method:'PUT',headers:{...H(false),'Content-Type':'application/json'},body:JSON.stringify({message:msg,content:b64(JSON.stringify(obj,null,2)),sha,branch:'main'})});if(!r.ok)throw new Error('save failed '+r.status+' (token needs repo access)');}
async function dispatch(wf,inputs){const r=await fetch(API('/actions/workflows/'+wf+'/dispatches'),{method:'POST',headers:{...H(false),'Content-Type':'application/json'},body:JSON.stringify({ref:'main',inputs})});if(!r.ok)throw new Error('could not start ('+r.status+')')}
async function stopRuns(){let n=0;
 for(const st of ['in_progress','queued']){const r=await fetch(API('/actions/runs?status='+st+'&per_page=20'),{headers:H(false),cache:'no-store'});
  if(!r.ok)throw new Error('cannot read runs ('+r.status+')');
  for(const run of (await r.json()).workflow_runs){if(!(run.path||'').includes('produce.yml'))continue;const c=await fetch(API('/actions/runs/'+run.id+'/cancel'),{method:'POST',headers:H(false)});if(c.ok)n++}}
 await new Promise(r=>setTimeout(r,4000));return n}
async function loadAll(){
 if(!S.repo){S.tab='settings';return render()}
 try{S.err='';
  S.cfg=await gread('config.json')||S.cfg;
  S.dates=(await glist('data/plans')).map(f=>f.name.replace('.json','')).sort().reverse();
  if(!S.date||!S.dates.includes(S.date))S.date=S.dates.includes(phToday())?phToday():S.dates[0]||phToday();
  S.plan=await gread('data/plans/'+S.date+'.json')||{date:S.date,items:[]};
  S.status=await gread('data/status.json')||{items:{}};S.res=await gread('data/results/'+S.date+'.json')||{items:{}};
  const rr=await fetch(API('/actions/runs?per_page=10'),{headers:H(false),cache:'no-store'});S.runs=rr.ok?(await rr.json()).workflow_runs:[];S.runsErr=rr.ok?'':'runs '+rr.status;
 }catch(e){S.err=e.message}
 render()}
const isRun=(x,w)=>x&&((x.path||'').includes(w+'.yml')||x.name==w);
const activeRun=()=>S.runs.some(x=>x.status!='completed')||(S.runsErr&&(S.status.run||{}).state=='running');
const pageName=id=>(S.cfg.pages.find(p=>p.id==id)||{}).name||id;
const PCT={queued:3,scripting:15,voicing:40,rendering:65,uploading:90,done:100,error:100};
function dateSel(){return `<select data-act="date">${[...new Set([...S.dates,S.date])].map(d=>`<option ${d==S.date?'selected':''}>${d}</option>`).join('')}</select>`}
function runBanner(){const r=S.runs.find(x=>isRun(x,'produce')),pl=S.runs.find(x=>isRun(x,'plan'));const f=x=>x?`<a style="color:#7dd3fc" href="${x.html_url}" target="_blank">${x.name}: ${x.status=='completed'?x.conclusion:x.status}</a>`:'';
 const run=S.status.run||{};return `<div class="card mut">${[f(pl),f(r)].filter(Boolean).join(' · ')||(S.runsErr?'Cannot read runs ('+S.runsErr+')':'No runs yet')}${run.message?`<br>Last run: ${esc(run.message)} (${esc(run.updated||'')})`:''}</div>`}
const views={
progress(){const its=S.plan.items.filter(i=>i.status!='skip');const done=its.filter(i=>(S.status.items[i.id]||{}).state=='done').length;
 return dateSel()+runBanner()+`<div class="card"><b>${done}/${its.length} videos ready</b><div class="bar"><i style="width:${its.length?done/its.length*100:0}%"></i></div>
 <button class="b" data-act="run">▶ Make videos now</button><button class="b r" data-act="stop">■ Stop</button><button class="b g" data-act="remakeall">↻ Remake all</button><button class="b g" data-act="reload">↻ Refresh</button></div>`+
 its.map(i=>{const s=S.status.items[i.id]||{},st0=s.state||'waiting',st=(!activeRun()&&['queued','scripting','voicing','rendering','uploading'].includes(st0))?'stopped':st0,stale=st=='done'&&s.built_rev!=(i.rev||0);return `<div class="card"><span class="chip">${esc(pageName(i.page))}</span> <span class="chip">${stale?'will remake':st}</span><div><b>${esc(i.title)}</b></div>
 <div class="bar"><i style="width:${PCT[st]||0}%;${st=='error'?'background:#ef4444':''}"></i></div>${s.msg?`<div class="err">${esc(s.msg)}</div>`:''}</div>`}).join('')||'<div class="card mut">No plan for this date yet. Open Plan → Generate.</div>'},
videos(){const its=S.plan.items.filter(i=>S.res.items[i.id]);return dateSel()+(its.map(i=>{const r=S.res.items[i.id],posted=LS['posted:'+i.id];
 return `<div class="card"><span class="chip">${esc(pageName(i.page))}</span> <span class="chip">${r.duration}s</span> ${posted?'<span class="chip">✅ posted</span>':''}<div><b>${esc(i.title)}</b></div>
 <video controls playsinline preload="metadata" src="${esc(r.url)}"></video>
 <a href="${esc(r.url)}" download><button class="b">⬇ Download</button></a>
 <button class="b g" data-act="copy" data-id="${i.id}" data-k="yt_title">Copy YT title</button><button class="b g" data-act="copy" data-id="${i.id}" data-k="yt_desc">Copy YT caption</button>
 <button class="b g" data-act="copy" data-id="${i.id}" data-k="tiktok">Copy TikTok</button><button class="b g" data-act="copy" data-id="${i.id}" data-k="facebook">Copy Facebook</button>
 <div><button class="b g" data-act="posted" data-id="${i.id}">${posted?'Undo posted':'Mark posted'}</button><button class="b r" data-act="remake" data-id="${i.id}">Remake</button></div></div>`}).join('')||'<div class="card mut">No finished videos for this date yet.</div>')},
plan(){return dateSel()+`<div class="card"><button class="b" data-act="save">💾 Save changes</button><button class="b g" data-act="add">＋ Add video</button><button class="b g" data-act="gen">✨ Generate new plan</button><button class="b r" data-act="clear">🗑 Clear all</button><div class="mut">Edit anything before the daily run. Generate replaces this date's plan.</div></div>`+
 S.plan.items.map((i,n)=>`<div class="card"><select data-f="page" data-n="${n}">${S.cfg.pages.map(p=>`<option value="${p.id}" ${p.id==i.page?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
 <input data-f="title" data-n="${n}" value="${esc(i.title)}" placeholder="Title"><textarea data-f="premise" data-n="${n}" placeholder="Story idea">${esc(i.premise)}</textarea>
 <button class="b g" data-act="skip" data-n="${n}">${i.status=='skip'?'Skipped – include':'Skip this'}</button><button class="b r" data-act="del" data-n="${n}">Delete</button></div>`).join('')},
settings(){return `<div class="card"><b>Connection</b><input id="repo" placeholder="owner/repo" value="${esc(S.repo)}"><input id="tok" type="password" placeholder="GitHub token" value="${esc(S.token)}">
 <button class="b" data-act="conn">Save</button><div class="err">${esc(S.err)}</div></div>
 <div class="card"><b>Your pages</b>${S.cfg.pages.map((p,n)=>`<input data-pf="name" data-n="${n}" value="${esc(p.name)}"><textarea data-pf="niche" data-n="${n}">${esc(p.niche)}</textarea>Videos per day <input data-pf="per_day" data-n="${n}" type="number" min="0" max="5" value="${p.per_day}">`).join('<hr>')}
 <button class="b" data-act="savecfg">Save pages</button><div class="mut">Total per day is capped at ${S.cfg.max_videos_per_day||15}.</div></div>
 <div class="card mut"><b>Better scripts (free)</b><br>Get a free key at aistudio.google.com/apikey, then add it as a repo secret named GEMINI_API_KEY (repo → Settings → Secrets → Actions).</div>`}};
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==S.tab));
 $('#runs').textContent=(S.runs[0]?(S.runs[0].status=='completed'?'':'● running'):'');
 $('#app').innerHTML=(S.err&&S.tab!='settings'?`<div class="card err">${esc(S.err)}</div>`:'')+views[S.tab]()}
async function busy(fn){try{await fn()}catch(e){alert(e.message)}await loadAll()}
document.addEventListener('click',async e=>{const nb=e.target.closest('nav button');if(nb){S.tab=nb.dataset.t;return render()}
 const b=e.target.closest('[data-act]');if(!b||b.tagName=='SELECT')return;const a=b.dataset.act,n=+b.dataset.n,id=b.dataset.id;
 if(a=='reload')return loadAll();
 if(a=='stop'){if(!confirm('Stop all running video jobs?'))return;return busy(async()=>{const n=await stopRuns();alert(n?'Stopped. Now you can tap Make videos now to start fresh.':'No running job found.')})}
 if(a=='remakeall'){if(activeRun()){alert('Tap Stop first.');return}if(!confirm('Make ALL videos for '+S.date+' again?'))return;return busy(async()=>{S.plan.items.forEach(i=>i.rev=(i.rev||0)+1);await gwrite('data/plans/'+S.date+'.json',S.plan,'remake all');await dispatch('produce.yml',{date:S.date});alert('Remaking all videos…')})}
 if(a=='run'&&activeRun()){alert('Already running. Tap Stop first if you want to restart.');return}
 if(a=='run')return busy(async()=>{await dispatch('produce.yml',{date:S.date});alert('Started! Check Progress in a minute.')});
 if(a=='gen'){if(!confirm('Replace the plan for '+S.date+'?'))return;return busy(async()=>{await dispatch('plan.yml',{date:S.date,force:'true'});alert('Planning… refresh in about a minute.')})}
 if(a=='clear'){if(!confirm('Remove ALL ideas from this date? (then tap Save changes)'))return;S.plan.items=[];return render()}
 if(a=='add'){S.plan.items.push({id:S.date+'-'+S.cfg.pages[0].id+'-'+Date.now().toString(36),page:S.cfg.pages[0].id,title:'',premise:'',roles:[],status:'planned',rev:0});return render()}
 if(a=='del'){S.plan.items.splice(n,1);return render()}
 if(a=='skip'){const i=S.plan.items[n];i.status=i.status=='skip'?'planned':'skip';return render()}
 if(a=='save')return busy(()=>gwrite('data/plans/'+S.date+'.json',S.plan,'edit plan '+S.date));
 if(a=='copy'){const t=S.res.items[id][b.dataset.k];try{await navigator.clipboard.writeText(t)}catch(_){const x=document.createElement('textarea');x.value=t;document.body.append(x);x.select();document.execCommand('copy');x.remove()}b.textContent='Copied ✓';return}
 if(a=='posted'){if(LS['posted:'+id])delete LS['posted:'+id];else LS['posted:'+id]='1';return render()}
 if(a=='remake'){if(!confirm('Make this video again?'))return;return busy(async()=>{const i=S.plan.items.find(x=>x.id==id);i.rev=(i.rev||0)+1;await gwrite('data/plans/'+S.date+'.json',S.plan,'remake '+id);await dispatch('produce.yml',{date:S.date});alert('Remaking…')})}
 if(a=='conn'){S.repo=$('#repo').value.trim();S.token=$('#tok').value.trim();LS.repo=S.repo;LS.token=S.token;S.tab='progress';return loadAll()}
 if(a=='savecfg')return busy(()=>gwrite('config.json',S.cfg,'update pages'))});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.act=='date'){S.date=t.value;S.tab=S.tab;return loadAll()}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.f)S.plan.items[+t.dataset.n][t.dataset.f]=t.value;if(t.dataset.pf)S.cfg.pages[+t.dataset.n][t.dataset.pf]=t.dataset.pf=='per_day'?+t.value:t.value});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
loadAll();setInterval(()=>{if(S.tab=='progress'&&!document.hidden)loadAll()},20000);
</script></body></html>
